  show(orCard, P(lt, T.angle - .4, .4) * out, slideIn(lt, T.angle - .4, -50));
  show(orLegend, P(lt, T.angle + .4, .3) * out);
  grpHeads.forEach(({ e, v, key }) => {
    const t0 = key === 'vlm' ? T.vlm : T.cls;
    show(e, P(lt, T.angle - .1, .3) * out);
    v.textContent = lt < t0 ? '' : `+${(ORIENT_AVG[key] * P(lt, t0 + .2, .9)).toFixed(1)} pts`;
  });
  ORIENT.forEach(([n, lh, gain], i) => {
    const y = ROW_Y(i), cf = lh - gain, isVlm = i >= 4, a = P(lt, T.angle + i * .04, .3) * out;
    show(orNames[i], a);
    if (a <= 0) return show(orGain[i], 0);
    const kc = P(lt, T.angle + .15 + i * .05, .55, E.inOut), t1 = (isVlm ? T.vlm + (i - 4) * .09 : T.cls + i * .09), kl = P(lt, t1, .6, E.inOut);
    g.save(); g.globalAlpha = a; g.lineCap = 'round';
    g.fillStyle = '#EEF1F5'; g.beginPath(); g.roundRect(BAR_X, y - 7, 100 * BAR_K, 14, 7); g.fill();
    g.fillStyle = '#C3CCD7'; g.beginPath(); g.roundRect(BAR_X, y - 7, Math.max(14, cf * BAR_K * kc), 14, 7); g.fill();
    if (kl > 0) { const gr = g.createLinearGradient(BAR_X + cf * BAR_K, 0, BAR_X + lh * BAR_K, 0); gr.addColorStop(0, ACC2); gr.addColorStop(1, ACC);
      g.fillStyle = gr; g.beginPath(); g.roundRect(BAR_X + cf * BAR_K - 7, y - 7, gain * BAR_K * kl + 7, 14, 7); g.fill(); }
    g.restore();
    orGain[i].textContent = `+${(gain * kl).toFixed(0)}`; orGain[i].style.left = (BAR_X + 100 * BAR_K + 18) + 'px'; orGain[i].style.top = (y - 11) + 'px';
    orGain[i].style.color = isVlm ? ACC : '#475569';
    show(orGain[i], P(lt, t1, .2) * out);
  });
  show(ocCard, P(lt, T.ocr - .4, .4) * out, slideIn(lt, T.ocr - .4, 50));
  show(ocLegend, P(lt, T.ocr, .3) * out);
  show(ocHead, P(lt, T.oracle + .1, .35) * out, rise(lt, T.oracle + .1, 10));
  OCR.forEach(([n, kind, ...vals], i) => {
    const cx = OC.cx(i), a = P(lt, T.ocr - .1 + i * .1, .3) * out;
    show(ocNames[i], a, rise(lt, T.ocr - .1 + i * .1, 8));
    if (a <= 0) return;
    g.save(); g.globalAlpha = a; g.fillStyle = LINE; g.fillRect(cx - 105, OC.base, 210, 1.5);
    [0, 1, 2].forEach(j => {
      const k = P(lt, T.ocr + .15 + i * .12 + j * .08, .55, E.out), v = vals[j] * k, h = v * OC.k, x = cx + OC.off[j] - OC.bw / 2;
      const gr = g.createLinearGradient(0, OC.base - h, 0, OC.base); gr.addColorStop(0, OC_COL[j]); gr.addColorStop(1, j === 2 ? hexA(ACC, .75) : OC_COL[j]);
      g.fillStyle = gr; g.beginPath(); g.roundRect(x, OC.base - h, OC.bw, Math.max(2, h), [6, 6, 2, 2]); g.fill();
      if (k > .5) { g.globalAlpha = a * P(lt, T.ocr + .5 + i * .12 + j * .08, .3); g.fillStyle = j === 2 ? ACC : MUTE; g.font = `${j === 2 ? 700 : 500} 14px GeistMono`; g.textAlign = 'center';
        g.fillText(vals[j].toFixed(3).replace(/^0/, ''), cx + OC.off[j], OC.base - h - 10); g.globalAlpha = a; }
    });
    // the oracle: the error a perfectly turned page gets; LevelHead's bar reaches it
    const ko = P(lt, T.oracle + i * .12, .5, E.inOut), oy = OC.base - vals[3] * OC.k;
    if (ko > 0) { g.strokeStyle = GREEN; g.lineWidth = 2.5; g.setLineDash([7, 6]); g.beginPath(); g.moveTo(cx - 100, oy); g.lineTo(cx - 100 + 200 * ko, oy); g.stroke(); g.setLineDash([]); }
    g.restore();
    if (ko >= 1) ring(cx + OC.off[2], oy, 8 + P(lt, T.oracle + i * .12 + .5, .6) * 28, GREEN, (1 - P(lt, T.oracle + i * .12 + .5, .6)) * out, 2);
  });
}

// =====================================================================
// CLOSE - a tilted page snaps level, then upright: LevelHead
// =====================================================================
const close = el(front, 'div', 'layer');
const icon = el(close, 'div', 'abs', { left: '900px', top: '240px', width: '120px', height: '156px', background: '#fff', borderRadius: '10px', boxShadow: `0 0 0 2.5px ${ACC}, 0 24px 48px -20px rgba(31,95,173,.55)` });
[26, 48, 66, 84, 102, 120].forEach((y, k) => el(icon, 'div', 'abs', { left: '20px', top: y + 'px', width: k === 0 ? '50px' : k % 3 === 2 ? '60px' : '80px', height: '7px', borderRadius: '4px', background: k === 0 ? ACC : '#D3DBE5' }));
const wordMask = el(close, 'div', 'abs', { left: '0', width: W + 'px', top: '452px', textAlign: 'center', overflow: 'hidden', paddingBottom: '14px' });
const word = el(wordMask, 'div', '', { fontSize: '140px', fontWeight: 690, letterSpacing: '-0.055em', lineHeight: 1 }, 'Level<span style="color:#1F5FAD">Head</span>');
const tag = el(close, 'div', 'abs', { left: '0', width: W + 'px', top: '628px', textAlign: 'center', fontSize: '42px', fontWeight: 520, color: MUTE, letterSpacing: '-0.02em' }, 'Deskew before you classify.');
const links = el(close, 'div', 'abs', { left: '0', width: W + 'px', top: '728px', display: 'flex', justifyContent: 'center' });
el(links, 'div', 'mono', { fontSize: '20px', color: INK, padding: '10px 20px', borderRadius: '12px', background: '#fff', border: `1px solid ${LINE}`, boxShadow: '0 10px 24px -16px rgba(20,32,46,.35)' }, 'github.com/beingamanforever/LevelHead');
const facts = el(close, 'div', 'abs', { left: '0', width: W + 'px', top: '810px', display: 'flex', justifyContent: 'center', gap: '12px' });
['training-free', 'any orientation model', 'runs in the browser', 'paper under review'].forEach(f => el(facts, 'span', 'mono', { fontSize: '15px', color: MUTE, padding: '7px 15px', borderRadius: '999px', background: '#fff', border: `1px solid ${LINE}` }, f));
function drawClose(t) {
  const lt = L('close', t);
  if (lt < 0) return show(close, 0);
  show(close, 1);
  const tg = beat('close', 'tag', .85);
  // the icon arrives turned 121 deg, levels (the tilt), then a quarter turn upright
  const lev = swing(lt, .25), up = swing(lt, .7);
  show(icon, P(lt, 0, .25), `rotate(${121 - 31 * lev - 90 * up}deg) scale(${.7 + .3 * pop(lt, 0)})`);
  show(word, 1, `translateY(${(1 - E.quint(P(lt, .45, .7, linear))) * 110}%)`);
  show(tag, P(lt, tg, .4), rise(lt, tg, 16));
  show(links, P(lt, tg + .55, .4), rise(lt, tg + .55, 10)); show(facts, P(lt, tg + .85, .4), rise(lt, tg + .85, 10));
  ring(960, 318, 90 + P(lt, .7, .9) * 240, ACC, (1 - P(lt, .7, .9)) * .5 * (lt > .7 ? 1 : 0), 2);
}

// a soft light sweeps the frame at each scene change
const sweep = el(stage, 'div', 'abs', { left: '0', top: '0', width: '560px', height: H + 'px', background: 'linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent)', pointerEvents: 'none' });
function drawSweep(t) {
  const sc = ORDER.slice(2).find(n => t >= SC[n].start && t < SC[n].start + .8);   // the first cut is the iris
  if (sc) { const k = (t - SC[sc].start) / .8; show(sweep, Math.sin(Math.PI * k) * .9, `translateX(${lerp(-560, W, E.inOut(k))}px)`); } else show(sweep, 0);
}

// ---------- cue sheet: every sound effect, timed from the same beats as the pictures (sfx.py renders them) ----------
const CUES = [];
// mix levels: the cold open has no voice, so its effects carry it; under the narration they sit about 10 LU below the voice
const SFX_LEVEL = scene => (scene === 'open' ? .5 : .33);
const cue = (scene, lt, kind, o = {}) => CUES.push({ t: +(SC[scene].start + lt).toFixed(3), kind, ...o, gain: (o.gain ?? 1) * SFX_LEVEL(scene) });
const PENTA = [1046.5, 1174.7, 1318.5, 1568.0, 1760.0, 2093.0, 2349.3];
const SWISH = { dur: .45, lo: 500, peak: 2600, end: 700 }, ZIP = { dur: .3, lo: 900, peak: 3400, end: 1300 };
{
  const { q } = openTimes();
  cue('open', 0, 'reveal', { gain: .5, dur: .42 });
  cue('open', .3, 'whoosh', { gain: .55, dur: 1.1, lo: 120, peak: 1300, end: 260 });
  // a whoosh for each page that rushes past the lens, at least 0.15 s apart, panned to its side
  let last = -1;
  tunnel.filter(p => p.z < ZT).map(p => { let lt = .2; while (lt < LOCK && p.z - camZ(lt) > NEAR + 260) lt += .002; return [lt, p]; })
    .sort((a, b) => a[0] - b[0]).forEach(([lt, p], i) => { if (lt - last < .15 || lt > LOCK - .4) return; last = lt;
      cue('open', lt - .2, 'whoosh', { gain: .22 + .1 * rnd(i), pan: clamp(p.x / 1400, -.8, .8), dur: .5, lo: 300, peak: 2200 + 600 * rnd(i + 9), end: 500, seed: i }); });
  cue('open', LOCK - 1.35, 'riser', { gain: .4, dur: 1.35 });
  cue('open', LOCK, 'boom', { gain: .85 });
  cue('open', LOCK + .03, 'shimmer', { gain: .16, dur: 1.6 });
  for (let n = 0, lt = LOCK + .35; lt < q - .85; n++, lt += SCAN_STEP) cue('open', lt, 'tick', { gain: .16, pan: Math.sin((TZ.turned + 90 * n) * Math.PI / 180) * .6 });
  [0, 1, 2, 3].forEach(i => cue('open', wordAt(q, i) + .08, 'hit', i === 3 ? { gain: .55, low: 46, snap: .7 } : { gain: .34 }));
  cue('open', q - .05, 'whoosh', { gain: .18, dur: .7, lo: 200, peak: 900, end: 260 });
  cue('open', q + .8, 'pop', { gain: .12 });
}
// a soft swish under the light sweep at every scene change
ORDER.slice(1).forEach(n => cue(n, 0, 'whoosh', { gain: .14, dur: .8, lo: 200, peak: 1100, end: 300 }));
cue('fail', -.3, 'whoosh', { gain: .2, dur: 1.1, lo: 120, peak: 700, end: 200, seed: 31 }); cue('fail', -.2, 'shimmer', { gain: .12, dur: 1.2 });
{
  const T = failTimes(), up = T.upside + .1;
  cue('fail', .45, 'pop', { gain: .1 }); cue('fail', .7, 'pop', { gain: .1, f0: 600, f1: 1000 });
  [0, 1, 2, 3].forEach(i => cue('fail', T.trained + .25 + i * .12, 'pop', { gain: .06, f0: 700 + 90 * i, f1: 1100 + 120 * i }));
  [T.guess - .75, T.deskew - .5, T.deskew - .05].forEach(lt => cue('fail', lt, 'whoosh', { gain: .1, ...ZIP }));
  cue('fail', T.guess, 'error', { gain: .2 });
  cue('fail', T.deskew + .3, 'whoosh', { gain: .12, ...SWISH });
  cue('fail', up, 'error', { gain: .32 }); cue('fail', up, 'hit', { gain: .2, low: 50, snap: .2 });
  for (let i = 0; i < TZ.cf.text.length; i += 3) cue('fail', up + .45 + i / 95, 'tick', { gain: .045, freq: 1800 + 900 * rnd(i) });
}
{
  const split = beat('insight', 'split', 1.4), tilt = beat('insight', 'tilt', 3.0), rows = beat('insight', 'rows', 5.6), letters = beat('insight', 'letters', 7.6);
  cue('insight', .15, 'whoosh', { gain: .12, ...SWISH });
  cue('insight', split, 'whoosh', { gain: .1, ...SWISH });
  cue('insight', split + .2, 'scan', { gain: .06, dur: .9 }); cue('insight', tilt + .1, 'scan', { gain: .06, dur: .6 });
  cue('insight', rows - .25, 'whoosh', { gain: .09, ...SWISH }); cue('insight', letters - .25, 'whoosh', { gain: .09, ...SWISH });
  [0, 1, 2, 3].forEach(k => cue('insight', letters + k * .42, 'tick', { gain: .12 }));
}
{
  const T = levelTimes();
  cue('level', T.streak - .1, 'shimmer', { gain: .13, dur: 1.0 });
  cue('level', T.streak + .5, 'scan', { gain: .1, dur: T.angle - T.streak - .5 });
  cue('level', T.angle, 'tick', { gain: .2 }); cue('level', T.angle, 'note', { gain: .14, freq: 1760 });
  cue('level', T.turn, 'whoosh', { gain: .12, ...SWISH });
}
{
  const tp = beat('hann', 'taper', 2.9), ret = beat('hann', 'returns', 4.4);
  cue('hann', 1.3, 'error', { gain: .16 });
  cue('hann', tp, 'shimmer', { gain: .13, dur: 1.1 });
  cue('hann', ret, 'chime', { gain: .2 });
}
{
  const four = beat('ask', 'four', 2.55);
  cue('ask', .45, 'whoosh', { gain: .12, ...SWISH });
  [0, 1, 2, 3].forEach(j => { cue('ask', .85 + j * .12, 'pop', { gain: .07, f0: 520 + 80 * j, f1: 900 + 120 * j });
    cue('ask', four - .45 + j * .16, 'whoosh', { gain: .06, ...ZIP, seed: j }); cue('ask', four + .75 + j * .14, 'note', { gain: .07, freq: PENTA[j] }); });
}
{
  const T = rollTimes();
  [1, 2, 3].forEach(j => cue('roll', T.roll + j * .25, 'tick', { gain: .12, freq: 2200 + 300 * j }));
  cue('roll', T.multiply, 'hit', { gain: .24 });
  for (let i = 0; i < 9; i++) cue('roll', T.multiply + .6 + .9 * Math.pow(i / 9, 1.6), 'tick', { gain: .05, freq: 3000 });
  cue('roll', T.outvoted, 'error', { gain: .16 });
  cue('roll', T.outvoted + 1.0, 'whoosh', { gain: .13, ...SWISH });
  cue('roll', T.outvoted + 1.6, 'chime', { gain: .24 });
}
{
  const wr = beat('any', 'wraps', .9), vlm = beat('any', 'vlm', 3.2);
  cue('any', .2, 'pop', { gain: .14, f0: 300, f1: 600 });
  BACKBONES.forEach(([n, isVlm], i) => cue('any', isVlm ? vlm - 1.0 + (i - 4) * .1 : wr + i * .12, 'pop', { gain: .06, pan: isVlm ? .6 : -.6, f0: 500 + 40 * i, f1: 900 + 60 * i }));
}
{
  const flat = beat('results', 'flat', 3.0), gains = beat('results', 'gains', 4.4);
  cue('results', flat, 'scan', { gain: .07, dur: 1.3 });
  cue('results', flat + 1.0, 'shimmer', { gain: .1, dur: 1.0 });
  D.tilt.forEach((_, i) => cue('results', gains + i * .09, 'tick', { gain: .06, pan: .4 }));
}
{
  const climb = beat('real', 'climb', 1.8);
  LEVELS.forEach((_, i) => { cue('real', climb + .2 + i * .1, 'tick', { gain: .07, freq: 900 }); cue('real', climb + .9 + i * .12, 'note', { gain: .1, freq: PENTA[i] }); });
  [0, 1].forEach(i => cue('real', climb + 1.4 + i * .4, 'pop', { gain: .1 }));
}
{
  const T = scoreTimes();
  cue('scores', T.angle - .4, 'whoosh', { gain: .12, ...SWISH, pan: -.4 });
  ORIENT.forEach((_, i) => { const t1 = i >= 4 ? T.vlm + (i - 4) * .09 : T.cls + i * .09; cue('scores', t1 + .1, 'note', { gain: .06, freq: PENTA[i >= 4 ? i - 4 : i] }); });
  cue('scores', T.ocr - .4, 'whoosh', { gain: .12, ...SWISH, pan: .4 });
  OCR.forEach((_, i) => cue('scores', T.ocr + .15 + i * .12, 'pop', { gain: .07, pan: .4 }));
  cue('scores', T.oracle + .4, 'chime', { gain: .22, pan: .3 });
}
{
  cue('close', 0, 'whoosh', { gain: .16, dur: .6, lo: 300, peak: 1800, end: 400 });
  cue('close', .25, 'tick', { gain: .14 });
  cue('close', .7, 'boom', { gain: .5 }); cue('close', .72, 'shimmer', { gain: .18, dur: 1.8 });
}
window.CUES = CUES.sort((a, b) => a.t - b.t);
window.MUSIC_AT = SC.open.start + LOCK;

// ---------- frame ----------
// z-order: background, scene layers (stages, headers), pages, cards in front, effects, sweep
stage.appendChild(pageLayer); stage.appendChild(front); stage.appendChild(fx); stage.appendChild(sweep); stage.appendChild(letterbox); stage.appendChild(grainC);
await document.fonts.load('650 78px Geist'); await document.fonts.load('500 15px GeistMono'); await document.fonts.ready;
{ // where the equation's terms sit, for the leader lines (layout is static, so this is measured once)
  const r = id => { const b = document.getElementById(id).getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; };
  EQ_K = r('eqk'); EQ_S = r('eqs');
}
window.seek = (t) => {
  drawBackground(t);
  g.clearRect(0, 0, W, H);
  [teaser, method, out2, ...views].forEach(p => show(p.e, 0)); rowGlow.style.opacity = 0;
  chCards.forEach(c => { c.style.transform = ''; c.style.width = '510px'; });
  [drawOpen, drawFail, drawInsight, drawLevel, drawHann, drawAsk, drawRoll, drawAny, drawResults, drawReal, drawScores, drawClose, drawSweep, drawGrain].forEach(f => f(t));
};
await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
window.READY = true;
seek(Number(new URLSearchParams(location.search).get('t') || 0));
</script>
